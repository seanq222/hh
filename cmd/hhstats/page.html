<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Stats</title>
<style>
:root { --bg:#f4f4f2; --panel:#ffffff; --ink:#1d1d1f; --muted:#6b6b70; --line:#dedede; --hi:#e8e8e4;
  --lo-ink:#1f5fd0; --lo-bg:#dbe7fb; --hi-ink:#c62a2a; --hi-bg:#fbdcdc; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#1e1e1e; --panel:#2a2a2a; --ink:#e9e9e9; --muted:#8e8e93; --line:#3a3a3a; --hi:#3a3a2a;
  --lo-ink:#8fb2f7; --lo-bg:#1f3354; --hi-ink:#ff8a8a; --hi-bg:#4a2226; } }
:root[data-theme="dark"] { --bg:#1e1e1e; --panel:#2a2a2a; --ink:#e9e9e9; --muted:#8e8e93; --line:#3a3a3a; --hi:#3a3a2a;
  --lo-ink:#8fb2f7; --lo-bg:#1f3354; --hi-ink:#ff8a8a; --hi-bg:#4a2226; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.35 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header h1 { font-size:16px; margin:0 8px 0 0; font-weight:600; }
.search { position:relative; flex:1; min-width:220px; max-width:420px; }
.search input { width:100%; padding:8px 10px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink); }
.list { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--panel); border:1px solid var(--line); border-radius:8px; max-height:320px; overflow:auto; display:none; box-shadow:0 6px 20px rgba(0,0,0,.18); }
.list div { padding:6px 10px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
.list div.on, .list div:hover { background:var(--hi); }
.list small, .hint { color:var(--muted); }
.hint { font-size:12px; }
main { padding:16px; max-width:1100px; margin:0 auto; }
.top { display:flex; gap:28px; flex-wrap:wrap; align-items:baseline; margin-bottom:14px; }
.top .name { font-size:22px; font-weight:600; overflow-wrap:anywhere; }
.top span { color:var(--muted); } .top b { color:var(--ink); font-weight:600; }
.grid { display:grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap:16px; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; overflow-x:auto; }
table { border-collapse:collapse; width:100%; }
th { color:var(--muted); font-weight:500; text-align:right; padding:4px 6px; white-space:nowrap; }
th:first-child { text-align:left; color:var(--ink); font-weight:600; font-size:15px; }
td { padding:4px 6px; text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
td:first-child { text-align:left; color:var(--muted); }
td.k { color:var(--muted); }
.v { font-weight:500; cursor:default; padding:1px 5px; border-radius:4px; }
.v sub { font-size:10px; font-weight:400; color:var(--muted); margin-left:2px; vertical-align:baseline; }
.v.thin { opacity:.55; }
.lo { color:var(--lo-ink); background:var(--lo-bg); }
.hi { color:var(--hi-ink); background:var(--hi-bg); }
.summary { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin:0 0 16px; line-height:1.45; }
.summary .style { font-size:16px; font-weight:600; margin-bottom:8px; }
.summary .style span { font-size:13px; font-weight:400; color:var(--muted); margin-left:8px; }
.summary .cols { display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; }
@media (max-width: 700px) { .summary .cols { grid-template-columns:1fr; } }
.summary h3 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:4px 0; color:var(--muted); font-weight:600; }
.summary h3.st { color:var(--lo-ink); } .summary h3.wk { color:var(--hi-ink); }
.summary ul { margin:0; padding-left:18px; } .summary li { margin:0 0 6px; }
.summary .n { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
.summary .ex { color:var(--muted); font-size:13px; }
.summary .none { color:var(--muted); margin:0; }
.summary .res { margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
.legend { color:var(--muted); font-size:12px; margin-top:14px; line-height:1.6; }
.legend .v { font-weight:600; }
</style></head><body>
<header>
  <h1>Player Stats</h1>
  <div class="search"><input id="q" placeholder="Search players" autocomplete="off" spellcheck="false"><div class="list" id="list"></div></div>
  <span class="hint" id="count"></span>
</header>
<main id="page"></main>
<script>
const D = /*DATA*/null;
const ALL = "All players";
const P = Object.assign({}, D.players, {[ALL]: D.all});
const names = Object.keys(D.players).sort((a, b) => a.localeCompare(b, undefined, {sensitivity: "base"}));
const MIN = 50; // fewer chances than this: dimmed and not coloured

function rate(p, k) { const x = p.stats[k]; return x && x[1] ? 100 * x[0] / x[1] : null; }
function af(p, i) { const a = p.aggr[i]; return a[2] ? (a[3] + a[4]) / a[2] : null; }
function afq(p, i) { const s = p.streets[i]; return s[0] ? 100 * s[1] / s[0] : null; }
function missedChances(p) { const a = p.stats["missed cbet IP rate"] || [0, 0], b = p.stats["missed cbet OOP rate"] || [0, 0];
  return [a[0] + b[0], a[1] + b[1]]; }
const special = {
  AF0: p => af(p, 0), AF1: p => af(p, 1), AF2: p => af(p, 2),
  AFQ0: p => afq(p, 0), AFQ1: p => afq(p, 1), AFQ2: p => afq(p, 2),
  MISSED: p => { const c = missedChances(p); return c[1] ? 100 * c[0] / c[1] : null; },
};
function value(p, k) { return special[k] ? special[k](p) : rate(p, k); }
// [done, chances] behind a value; for the aggression factor, the calls.
function chances(p, k) {
  if (/^AF\d$/.test(k)) { const a = p.aggr[+k[2]]; return [a[3] + a[4], a[2]]; }
  if (/^AFQ\d$/.test(k)) return p.streets[+k[3]];
  if (k === "MISSED") return missedChances(p);
  return p.stats[k] || null;
}
function isFactor(k) { return /^AF\d$/.test(k); }
function fmt(x, k) {
  if (x === null) return "-";
  if (isFactor(k)) return x.toFixed(1);
  return x < 10 ? x.toFixed(1) : Math.round(x).toString();
}
function cell(p, k) {
  if (!k) return "<td></td>";
  const x = value(p, k), c = chances(p, k);
  if (x === null) return '<td><span class="v">-</span></td>';
  const small = c && c[1] < MIN, n = D.normal[k];
  let cls = "", tip = "";
  if (n) {
    tip = "normal " + n[0] + "–" + n[1];
    if (!small) cls = x < n[0] ? "lo" : x > n[1] ? "hi" : "";
  }
  if (c) tip += (tip ? " · " : "") + c[0].toLocaleString() + (isFactor(k) ? " bets and raises / " : " / ") + c[1].toLocaleString() + (isFactor(k) ? " calls" : "");
  return '<td><span class="v ' + cls + (small ? " thin" : "") + '" title="' + tip + '">' + fmt(x, k) +
    (small ? "<sub>" + c[1] + "</sub>" : "") + "</span></td>";
}
function table(head, rows, p) {
  let h = "<table><tr>" + head.map(x => "<th>" + x + "</th>").join("") + "</tr>";
  for (const r of rows) {
    h += "<tr><td>" + r[0] + "</td>";
    for (const k of r.slice(1)) h += (k && k.startsWith("=")) ? '<td class="k">' + k.slice(1) + "</td>" : cell(p, k);
    h += "</tr>";
  }
  return h + "</table>";
}
const POS = ["EP", "MP", "CO", "BTN", "SB", "BB"];
function byPos(label, k, only) { return [label, k].concat(POS.map(x => (!only || only.includes(x)) ? k + " " + x : "")); }
const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");

// A short read of a player: style, then strengths and weaknesses from the
// stats outside their normal range with 50+ chances, the furthest out first.
// [stat, side ("lo" below the range, "hi" above), "s" strength or "w"
// weakness, what it says, how to play against it].
const RULES = [
  ["steal", "hi", "s", "Steal a lot"],
  ["steal", "lo", "w", "Rarely steal", "the blinds play them cheaply"],
  ["open", "lo", "w", "Open few hands", "give their opens credit and attack their blinds"],
  ["3-bet", "hi", "s", "3-bet often"],
  ["3-bet", "lo", "w", "Rarely 3-bet", "open wide into them and give their 3-bets credit"],
  ["fold to 3-bet", "hi", "w", "Fold to 3-bets too often", "3-bet them light"],
  ["fold to 3-bet", "lo", "s", "Seldom fold to 3-bets"],
  ["call open", "hi", "w", "Cold-call opens a lot", "isolate and value-bet them"],
  ["vs steal fold BB", "hi", "w", "Fold the big blind to steals too often", "steal from them"],
  ["vs steal fold BB", "lo", "s", "Defend the big blind well against steals"],
  ["squeeze", "hi", "s", "Squeeze often"],
  ["4-bet", "lo", "w", "Rarely 4-bet", "3-bet their opens more"],
  ["fold to 4-bet", "hi", "w", "Fold to 4-bets too often", "4-bet them light"],
  ["cbet flop", "hi", "s", "C-bet the flop a lot"],
  ["cbet flop", "lo", "w", "C-bet the flop rarely", "stab when they check"],
  ["cbet turn", "lo", "w", "Give up on the turn after c-betting", "float their flop bets"],
  ["fold to cbet flop", "hi", "w", "Fold to flop c-bets too often", "c-bet them wider"],
  ["fold to cbet flop", "lo", "w", "Rarely fold to flop c-bets", "value-bet them thinner and bluff them less"],
  ["fold to cbet turn", "hi", "w", "Fold to turn barrels too often", "barrel them"],
  ["fold to cbet river", "lo", "w", "Call river bets a lot", "value-bet the river"],
  ["missed cbet OOP fold", "hi", "w", "Give up after checking out of position", "bet when they check"],
  ["vs missed cbet bet IP", "hi", "s", "Attack missed c-bets"],
  ["vs missed cbet bet IP", "lo", "w", "Rarely bet when checked to", "check-call more against them"],
  ["WTSD", "hi", "w", "Go to showdown a lot", "bluff them less"],
  ["W$SD", "lo", "w", "Win too little at showdown", "they call down light"],
  ["W$SD", "hi", "s", "Win at showdown more than most"],
  ["AF2", "hi", "s", "Aggressive on the river"],
  ["AF0", "lo", "w", "Passive on the flop", "their raises are strong"],
  ["donk flop", "hi", "w", "Donk-bet the flop often", "raise their leads"],
  ["limp", "hi", "w", "Limp a lot", "isolate them"],
];
// Where x sits against stat k's range: 0 at the bottom, 1 at the top, beyond
// them outside it; null without a range or with too few chances.
function where(p, k) {
  const x = value(p, k), c = chances(p, k), n = D.normal[k];
  if (x === null || !n || (c && c[1] < MIN) || n[1] <= n[0]) return null;
  return {x: x, n: n, at: (x - n[0]) / (n[1] - n[0])};
}
function summaryHTML(name, p) {
  if (name === ALL) return "";
  const vp = where(p, "VPIP");
  if (!vp) return "";
  const tight = vp.at < 0 ? "Tight" : vp.at > 1 ? "Loose" : "Standard";
  const agg = ["AF0", "AF1", "AF2", "PFR"].map(k => where(p, k)).filter(w => w);
  const a = agg.length ? agg.reduce((t, w) => t + w.at, 0) / agg.length : 0.5;
  const style = a > 0.85 ? "aggressive" : a < 0.15 ? "passive" : "balanced";
  const hits = {s: [], w: []};
  for (const [k, side, kind, what, exploit] of RULES) {
    const w = where(p, k);
    if (!w || (k === "limp" && w.x < 3)) continue; // near-zero limping says nothing
    const out = side === "hi" ? w.at - 1 : -w.at; // how far outside, in range widths
    if (out > 0 && !hits[kind].some(h => h.k === k))
      hits[kind].push({k: k, out: out, what: what, exploit: exploit,
        nums: fmt(w.x, k) + (isFactor(k) ? "" : "%") + " vs " + w.n[0] + "–" + w.n[1]});
  }
  const list = (title, items, cls) => '<div><h3 class="' + cls + '">' + title + "</h3>" +
    (items.length ? "<ul>" + items.sort((x, y) => y.out - x.out).slice(0, 3).map(x => "<li><b>" + x.what +
      '</b> <span class="n">' + x.nums + "</span>" + (x.exploit ? '<div class="ex">→ ' + x.exploit + "</div>" : "") + "</li>").join("") + "</ul>"
      : '<p class="none">None outside the normal range.</p>') + "</div>";
  const e = 100 * p.ev / Math.max(p.hands, 1);
  const cat = e > 0 ? "winner" : e > -4 ? "almost a winner" : "loser";
  const tb = value(p, "3-bet");
  return '<section class="summary"><div class="style">' + tight + ", " + style + " <span>VPIP " + fmt(vp.x, "VPIP") +
    " · PFR " + fmt(value(p, "PFR"), "PFR") + (tb === null ? "" : " · 3-bet " + fmt(tb, "3-bet")) + "</span></div>" +
    '<div class="cols">' + list("Strengths", hits.s, "st") + list("Weaknesses", hits.w, "wk") + "</div>" +
    '<div class="res">' + (e >= 0 ? "+" : "") + e.toFixed(1) + " bb/100 EV over " + p.hands.toLocaleString() + " hands: " + cat +
    " (a winner is above 0 bb/100, almost a winner -4 to 0)</div></section>";
}

let current = null;
function render(name) {
  const p = P[name]; if (!p) return;
  current = name;
  const b100 = x => (100 * x / Math.max(p.hands, 1)).toFixed(1);
  const pre = table(["PRE-FLOP", "Total"].concat(POS), [
    byPos("Open Raise", "open", ["EP", "MP", "CO", "BTN", "SB"]),
    byPos("Fold to 3Bet", "fold to 3-bet", ["EP", "MP", "CO", "BTN", "SB"]),
    byPos("Call Open Raise", "call open"),
    byPos("3-Bet", "3-bet"),
    byPos("3-Bet In Position", "3-bet IP", ["EP", "MP", "CO", "BTN", "BB"]),
    byPos("3-Bet Out of Position", "3-bet OOP", ["SB", "BB"])], p);
  const right = table(["", ""], [["4-Bet", "4-bet"], ["4-Bet-Fold", "4-bet fold"], ["Fold to 4-Bet", "fold to 4-bet"],
    ["Call 4-Bet", "call 4-bet"], ["5-Bet", "5-bet"], ["Limp", "limp"], ["Limp-Fold", "limp fold"], ["Squeeze", "squeeze"]], p);
  const steal = table(["", "Total", "BTN", "SB"], [["Steal", "steal", "steal BTN", "steal SB"],
    ["Fold to 3Bet", "steal fold to 3-bet", "steal fold to 3-bet BTN", "steal fold to 3-bet SB"],
    ["4-Bet", "steal 4-bet", "steal 4-bet BTN", "steal 4-bet SB"],
    ["4-Bet-Fold", "steal 4-bet fold", "steal 4-bet fold BTN", "steal 4-bet fold SB"]], p);
  const vsSteal = table(["vs. Steal", "SB", "BB"], [["Fold", "vs steal fold SB", "vs steal fold BB"],
    ["Call", "vs steal call SB", "vs steal call BB"], ["3-Bet", "vs steal 3-bet SB", "vs steal 3-bet BB"]], p);
  const post = table(["POSTFLOP", "Flop", "Turn", "River"], [
    ["Continuation Bet", "cbet flop", "cbet turn", "cbet river"],
    ["Fold to Continuation Bet", "fold to cbet flop", "fold to cbet turn", "fold to cbet river"],
    ["Aggression", "AF0", "AF1", "AF2"], ["Aggression Frequency", "AFQ0", "AFQ1", "AFQ2"],
    ["Donk Bet", "donk flop", "donk turn", "donk river"]], p);
  const vsCbet = table(["vs. Continuation Bet Flop", "Fold", "Call", "Raise"], [
    ["Raised Pot", "vs cbet raised pot fold", "vs cbet raised pot call", "vs cbet raised pot raise"],
    ["3-Bet Pot", "vs cbet 3-bet pot fold", "vs cbet 3-bet pot call", "vs cbet 3-bet pot raise"]], p);
  const miss = table(["Missed Continuation Bet", "", "", ""], [["Total", "MISSED", "", ""],
    ["In Position", "missed cbet IP rate", "=→ Fold", "missed cbet IP fold"],
    ["Out of Position", "missed cbet OOP rate", "=→ Fold", "missed cbet OOP fold"]], p);
  const vsMiss = table(["vs. Missed Continuation Bet", "", "", ""], [["Total", "vs missed cbet", "", ""],
    ["Bet In Position", "vs missed cbet bet IP", "=Check | Fold", "vs missed cbet check|fold"],
    ["Bet Out of Position Turn", "vs missed cbet bet OOP turn", "=Check-Fold", "vs missed cbet check-fold"]], p);
  const sd = table(["SHOWDOWN", ""], [["Went to Showdown", "WTSD"], ["Won at Showdown", "W$SD"], ["Won When Saw Flop", "WWSF"]], p);
  document.getElementById("page").innerHTML =
    '<div class="top"><span class="name">' + esc(name) + "</span>" +
    "<span><b>" + p.hands.toLocaleString() + "</b> hands</span>" +
    "<span><b>" + b100(p.net) + "</b> bb/100</span><span>EV <b>" + b100(p.ev) + "</b></span>" +
    "<span>VPIP <b>" + fmt(value(p, "VPIP"), "VPIP") + "</b></span><span>PFR <b>" + fmt(value(p, "PFR"), "PFR") + "</b></span></div>" +
    summaryHTML(name, p) +
    '<div class="grid"><div class="card">' + pre + '</div><div class="card">' + right + "</div>" +
    '<div class="card">' + steal + '</div><div class="card">' + vsSteal + "</div>" +
    '<div class="card">' + post + '</div><div class="card">' + vsCbet + "</div>" +
    '<div class="card">' + miss + '</div><div class="card">' + vsMiss + "</div>" +
    '<div class="card">' + sd + "</div></div>" +
    '<p class="legend"><span class="v lo">low</span> below the normal range · <span class="v">normal</span> · ' +
    '<span class="v hi">high</span> above it. Less or more than usual, not worse or better. ' +
    "A small number beside a dimmed value is its chances, when under " + MIN + "; those are not coloured. " +
    "Hover a value for its normal range and its count.</p>";
  document.title = name + " · Player Stats";
  try { history.replaceState(null, "", "#" + encodeURIComponent(name)); } catch (e) {}
}

const q = document.getElementById("q"), list = document.getElementById("list");
document.getElementById("count").textContent = names.length + " players";
let shown = [], on = 0;
function show() {
  const t = q.value.trim().toLowerCase();
  shown = [ALL].concat(names).filter(n => n.toLowerCase().includes(t))
    .sort((a, b) => (a.toLowerCase().startsWith(t) ? 0 : 1) - (b.toLowerCase().startsWith(t) ? 0 : 1)).slice(0, 50);
  on = 0;
  list.innerHTML = shown.map((n, i) => '<div data-i="' + i + '"' + (i === 0 ? ' class="on"' : "") + ">" +
    esc(n) + "<small>" + P[n].hands.toLocaleString() + " hands</small></div>").join("");
  list.style.display = shown.length ? "block" : "none";
}
function pick(i) { if (!shown[i]) return; render(shown[i]); q.value = ""; list.style.display = "none"; q.blur(); }
q.addEventListener("input", show);
q.addEventListener("focus", show);
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    on = Math.max(0, Math.min(shown.length - 1, on + (e.key === "ArrowDown" ? 1 : -1)));
    [...list.children].forEach((c, i) => c.classList.toggle("on", i === on));
    list.children[on]?.scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter") pick(on);
  else if (e.key === "Escape") { list.style.display = "none"; q.blur(); }
});
list.addEventListener("mousedown", e => { const d = e.target.closest("div[data-i]"); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) list.style.display = "none"; });
const start = decodeURIComponent(location.hash.slice(1));
render(P[start] ? start : ALL);
</script></body></html>
